<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Manager | Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Student Task Manager</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div id="nav" class="collapse navbar-collapse"><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Home</a><a class="nav-link active" href="tasks.html">Tasks</a><a class="nav-link" href="about.html">About</a><button class="btn btn-outline-light btn-sm ms-lg-2" id="themeButton" title="Toggle dark mode"><i class="bi bi-moon"></i></button></div></div>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Task Management</h1>
    <p class="text-muted">Add and manage your tasks below.</p>
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input id="search" class="form-control" placeholder="Search tasks">
      <button id="clearButton" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Clear All</button>
    </div>
    <form id="taskForm" class="card card-body mb-4">
      <input type="hidden" id="editId">
      <div class="row g-3 align-items-end">
        <div class="col-md-5"><label class="form-label" for="title">Task title</label><input id="title" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label" for="dueDate">Due date</label><input id="dueDate" class="form-control" type="date" required></div>
        <div class="col-md-2"><label class="form-label" for="priority">Priority</label><select id="priority" class="form-select"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit" id="submitButton">Add Task</button></div>
      </div>
      <div id="formMessage" class="text-danger mt-2"></div>
    </form>
    <div class="row text-center g-3 mb-4">
      <div class="col-md-4"><div class="card card-body"><strong>Total</strong><span id="total">0</span></div></div>
      <div class="col-md-4"><div class="card card-body"><strong>Pending</strong><span id="pending">0</span></div></div>
      <div class="col-md-4"><div class="card card-body"><strong>Completed</strong><span id="completed">0</span></div></div>
    </div>
    <div id="taskList" class="list-group"></div>
  </main>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
